
networks:
  app:
    driver: bridge

services:
  workflow_service:
    image: ignaxa/workflow_service:latest
    container_name: workflow_service
    build:
      context: ./workflow-service
    networks:
      app:
    ports:
      - "8081:8081"

  file_storage_service:
    image: ignaxa/file_storage_service:latest
    container_name: file_storage_service
    build:
      context: ./file-storage-service
    networks:
      app:
    ports:
      - "8082:8082"

  cryptography_service:
    image: ignaxa/cryptography_service:latest
    container_name: cryptography_service
    build:
      context: ./cryptography-service
    networks:
      app:
    ports:
      - "8083:8083"
